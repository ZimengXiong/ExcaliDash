name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Publishing runs must finish promoting both images; superseded PR checks can stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: zimengxiong

jobs:
  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install test dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Run backend tests
        run: |
          cd backend
          npm test

  repo-checks:
    name: Repo Checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install check dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Check formatting and lint
        run: npm run check

      - name: Run frontend unit and lab configuration tests
        run: |
          npm --prefix frontend run test:unit
          node --test scripts/lab-frontend-ports.test.mjs

      - name: Build documentation
        run: npm run docs:build

  e2e-tests:
    name: E2E (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [anonymous, authenticated]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies and generate Prisma client
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix e2e ci
          cd backend && npx prisma generate

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Typecheck browser tests
        run: npm --prefix e2e run check

      - name: Run real browser and API journeys
        run: npm --prefix e2e test
        env:
          E2E_AUTH: ${{ matrix.mode == 'authenticated' && 'true' || 'false' }}

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-${{ matrix.mode }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  release-metadata:
    name: Release Metadata
    needs: [backend-tests, repo-checks, e2e-tests]
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.metadata.outputs.stable }}
      version: ${{ steps.metadata.outputs.version }}
      image-tag: ${{ steps.metadata.outputs.image_tag }}
      build-label: ${{ steps.metadata.outputs.build_label }}
      platforms: ${{ steps.metadata.outputs.platforms }}
      publish: ${{ steps.metadata.outputs.publish }}
      tags: ${{ steps.metadata.outputs.tags }}

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Derive image metadata
        id: metadata
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA::7}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable x.y.z version." >&2
            exit 1
          fi

          publish=false
          stable=false
          image_tag="ci-${short_sha}"
          platforms="linux/amd64"

          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/dev ]; then
            publish=true
            image_tag="${version}-dev.${short_sha}"
            platforms="linux/amd64,linux/arm64"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=true
            stable=true
            image_tag="${version}"
            platforms="linux/amd64,linux/arm64"

            release_tag="v${version}"
            if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
              tagged_sha="$(git rev-list -n 1 "$release_tag")"
              if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
                echo "$release_tag already belongs to $tagged_sha." >&2
                exit 1
              fi
            fi
          fi
          build_label="${image_tag}"

          tags="type=raw,value=${image_tag}"

          {
            echo "version=$version"
            echo "image_tag=$image_tag"
            echo "build_label=$build_label"
            echo "platforms=$platforms"
            echo "publish=$publish"
            echo "stable=$stable"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  backend-image:
    name: Backend Image
    needs: release-metadata
    permissions:
      contents: read
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a
    with:
      job-name-prefix: Backend
      output: image
      context: .
      file: backend/Dockerfile
      platforms: ${{ needs.release-metadata.outputs.platforms }}
      push: ${{ needs.release-metadata.outputs.publish == 'true' }}
      cache: true
      cache-mode: max
      cache-scope: backend-image
      build-args: APP_BUILD_LABEL=${{ needs.release-metadata.outputs.build-label }}
      sbom: ${{ needs.release-metadata.outputs.publish == 'true' }}
      meta-images: zimengxiong/excalidash-backend
      meta-tags: ${{ needs.release-metadata.outputs.tags }}
      meta-labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.release-metadata.outputs.image-tag }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: zimengxiong
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  frontend-image:
    name: Frontend Image
    needs: release-metadata
    permissions:
      contents: read
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a
    with:
      job-name-prefix: Frontend
      output: image
      context: .
      file: frontend/Dockerfile
      platforms: ${{ needs.release-metadata.outputs.platforms }}
      push: ${{ needs.release-metadata.outputs.publish == 'true' }}
      cache: true
      cache-mode: max
      cache-scope: frontend-image
      sbom: ${{ needs.release-metadata.outputs.publish == 'true' }}
      build-args: VITE_APP_BUILD_LABEL=${{ needs.release-metadata.outputs.build-label }}
      meta-images: zimengxiong/excalidash-frontend
      meta-tags: ${{ needs.release-metadata.outputs.tags }}
      meta-labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.release-metadata.outputs.image-tag }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: zimengxiong
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  image-builds:
    name: Container Image Builds
    needs: [release-metadata, backend-image, frontend-image]
    if: always() && needs.release-metadata.result == 'success' && needs.backend-image.result == 'success' && needs.frontend-image.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ needs.release-metadata.outputs.publish }}
      stable: ${{ needs.release-metadata.outputs.stable }}
      version: ${{ needs.release-metadata.outputs.version }}
      image-tag: ${{ needs.release-metadata.outputs.image-tag }}

    steps:
      - name: Check out image checks
        if: needs.release-metadata.outputs.publish == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify published images
        if: needs.release-metadata.outputs.publish == 'true'
        shell: bash
        run: |
          for component in backend frontend; do
            image="${DOCKERHUB_USERNAME}/excalidash-${component}:${{ needs.release-metadata.outputs.image-tag }}"
            docker buildx imagetools inspect "$image" --raw | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] as $architectures
              | ($architectures | index("amd64") != null) and ($architectures | index("arm64") != null)
            '
          done

      - name: Check offline production startup before promotion
        if: needs.release-metadata.outputs.publish == 'true'
        shell: bash
        run: |
          image="${DOCKERHUB_USERNAME}/excalidash-backend:${{ needs.release-metadata.outputs.image-tag }}"
          docker pull "$image"
          node scripts/check-image-startup.mjs "$image"

      - name: Promote verified image pair
        if: needs.release-metadata.outputs.publish == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FLOATING_TAG: ${{ needs.release-metadata.outputs.stable == 'true' && 'latest' || 'dev' }}
        shell: bash
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout >/dev/null 2>&1' EXIT
          for component in backend frontend; do
            image="${DOCKERHUB_USERNAME}/excalidash-${component}"
            docker buildx imagetools create \
              --tag "${image}:${FLOATING_TAG}" \
              "${image}:${{ needs.release-metadata.outputs.image-tag }}"
          done

      - name: Confirm CI image builds
        if: needs.release-metadata.outputs.publish != 'true'
        run: echo "Container images built successfully; this event does not publish them."

  github-release:
    name: GitHub Release
    needs: image-builds
    if: needs.image-builds.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image-builds.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --notes "move to new CI release pipeline" \
            --latest \
            --title "ExcaliDash ${VERSION}"

  github-dev-release:
    name: GitHub Dev Release
    needs: image-builds
    if: needs.image-builds.outputs.publish == 'true' && needs.image-builds.outputs.stable != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.image-builds.outputs.image-tag }}
        run: |
          tag="v${IMAGE_TAG}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --notes "Development container images: ${DOCKERHUB_USERNAME}/excalidash-backend:${IMAGE_TAG} and ${DOCKERHUB_USERNAME}/excalidash-frontend:${IMAGE_TAG}." \
            --prerelease \
            --title "ExcaliDash ${IMAGE_TAG}"

  sync-dev:
    name: Sync Main Back To Dev
    needs: [image-builds, github-release]
    if: needs.image-builds.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Fast-forward dev when it has not moved
        shell: bash
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/dev"
          else
            echo "dev advanced during the release; skipping automatic sync." >> "$GITHUB_STEP_SUMMARY"
          fi
