name: Dev prerelease

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-prereleases
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: zimengxiong

jobs:
  verify:
    name: Verify source
    if: >-
      github.event.head_commit.message == '!release' ||
      startsWith(github.event.head_commit.message, '!release ')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - name: Validate prerelease notes
        id: release
        shell: bash
        run: |
          if [ ! -s RELEASE.md ]; then
            echo "RELEASE.md must exist and contain prerelease notes." >&2
            exit 1
          fi
          if ! git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" -- |
            grep -Fxq RELEASE.md; then
            echo "The !release commit must update RELEASE.md." >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable x.y.z base version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install application dependencies
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund

      - name: Run merge gates
        run: make verify

  build:
    name: Build dev images (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.DOCKERHUB_USERNAME }}/excalidash-backend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dev-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-backend-${{ matrix.arch }}

      - name: Build frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VITE_APP_VERSION=${{ needs.verify.outputs.version }}-dev
            VITE_APP_BUILD_LABEL=development
          outputs: type=image,name=${{ env.DOCKERHUB_USERNAME }}/excalidash-frontend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dev-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-frontend-${{ matrix.arch }}

      - name: Export image digests
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/backend /tmp/digests/frontend
          touch "/tmp/digests/backend/${BACKEND_DIGEST#sha256:}"
          touch "/tmp/digests/frontend/${FRONTEND_DIGEST#sha256:}"

      - name: Upload image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  images:
    name: Publish dev image manifests
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish backend manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          repository="${DOCKERHUB_USERNAME}/excalidash-backend"
          sources=()
          for digest in /tmp/digests/backend/*; do
            sources+=("${repository}@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create \
            --tag "${repository}:dev" \
            --tag "${repository}:${VERSION}-dev" \
            --tag "${repository}:${VERSION}-dev-${short_sha}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${repository}:${VERSION}-dev-${short_sha}"

      - name: Publish frontend manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          repository="${DOCKERHUB_USERNAME}/excalidash-frontend"
          sources=()
          for digest in /tmp/digests/frontend/*; do
            sources+=("${repository}@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create \
            --tag "${repository}:dev" \
            --tag "${repository}:${VERSION}-dev" \
            --tag "${repository}:${VERSION}-dev-${short_sha}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${repository}:${VERSION}-dev-${short_sha}"

  release:
    name: Create GitHub prerelease
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Derive prerelease tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA::7}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable x.y.z base version." >&2
            exit 1
          fi
          echo "tag=v${version}-dev.${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExcaliDash $RELEASE_TAG" \
            --notes-file RELEASE.md \
            --prerelease
