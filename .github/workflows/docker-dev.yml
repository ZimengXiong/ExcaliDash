name: Dev prerelease

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-prereleases
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: zimengxiong

jobs:
  verify:
    name: Verify source
    if: >-
      github.event.head_commit.message == '!release' ||
      startsWith(github.event.head_commit.message, '!release ')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - name: Validate prerelease notes
        shell: bash
        run: |
          if [ ! -s RELEASE.md ]; then
            echo "RELEASE.md must exist and contain prerelease notes." >&2
            exit 1
          fi
          if ! git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" -- |
            grep -Fxq RELEASE.md; then
            echo "The !release commit must update RELEASE.md." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install application dependencies
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund

      - name: Run merge gates
        run: make verify

  images:
    name: Build dev images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Derive dev-only tags
        id: tags
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA::7}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable x.y.z base version." >&2
            exit 1
          fi
          {
            echo "version=${version}-dev"
            echo "backend=${DOCKERHUB_USERNAME}/excalidash-backend:dev"
            echo "backend_version=${DOCKERHUB_USERNAME}/excalidash-backend:${version}-dev"
            echo "backend_sha=${DOCKERHUB_USERNAME}/excalidash-backend:${version}-dev-${short_sha}"
            echo "frontend=${DOCKERHUB_USERNAME}/excalidash-frontend:dev"
            echo "frontend_version=${DOCKERHUB_USERNAME}/excalidash-frontend:${version}-dev"
            echo "frontend_sha=${DOCKERHUB_USERNAME}/excalidash-frontend:${version}-dev-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.backend }}
            ${{ steps.tags.outputs.backend_version }}
            ${{ steps.tags.outputs.backend_sha }}
          cache-from: type=gha,scope=dev-backend
          cache-to: type=gha,mode=max,scope=dev-backend

      - name: Build frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.tags.outputs.version }}
            VITE_APP_BUILD_LABEL=development
          tags: |
            ${{ steps.tags.outputs.frontend }}
            ${{ steps.tags.outputs.frontend_version }}
            ${{ steps.tags.outputs.frontend_sha }}
          cache-from: type=gha,scope=dev-frontend
          cache-to: type=gha,mode=max,scope=dev-frontend

  release:
    name: Create GitHub prerelease
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Derive prerelease tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA::7}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable x.y.z base version." >&2
            exit 1
          fi
          echo "tag=v${version}-dev.${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ExcaliDash $RELEASE_TAG" \
            --notes-file RELEASE.md \
            --prerelease
