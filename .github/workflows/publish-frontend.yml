name: Publish frontend image

# Builds the frontend (ExcaliDash + excalidraw-animate) and pushes it to
# ghcr.io/<owner>/excalidash-frontend. Runs for tags such as v0.6.6-animate.1,
# or by hand with an explicit image tag.
on:
  push:
    tags:
      - "v*-animate.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 0.6.6-animate.2"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_APP_BUILD_LABEL=${{ steps.tag.outputs.value }}
          tags: ghcr.io/${{ github.repository_owner }}/excalidash-frontend:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
