{{- if include "postgresql.shouldRender" . }}
{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.password }}
{{- fail "postgresql.auth: set password or existingSecret; passwords are never generated" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.existingSecretPasswordKey }}: {{ .Values.auth.password | b64enc | quote }}
{{- end }}
{{- end }}
