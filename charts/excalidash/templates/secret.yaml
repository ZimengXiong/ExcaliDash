{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "excalidash.secretName" . }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  CSRF_SECRET: {{ .Values.secrets.csrfSecret | b64enc | quote }}
  API_KEY_HASH_PEPPER: {{ .Values.secrets.apiKeyHashPepper | b64enc | quote }}
  {{- if .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if .Values.global.externalDatabase.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "excalidash.databaseSecretName" . }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.global.externalDatabase.url | b64enc | quote }}
{{- end }}
