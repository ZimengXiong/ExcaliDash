apiVersion: v1
kind: Service
metadata:
  name: {{ include "excalidash.fullname" . }}-backend
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "excalidash.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "excalidash.fullname" . }}-frontend
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "excalidash.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
